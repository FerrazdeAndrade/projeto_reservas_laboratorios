<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de Laboratório</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Nova Reserva</h1>
    <form id="form-reserva">
        <input type="text" id="laboratorio" placeholder="Laboratório" required>
        <input type="text" id="responsavel" placeholder="Responsável" required>
        <input type="date" id="data" required>
        <input type="text" id="turno" placeholder="Turno (Ex: Manhã)" required>
        <input type="text" id="finalidade" placeholder="Finalidade" required>
        <input type="number" id="quantidade_de_alunos" placeholder="Qtd. Alunos (1-40)" min="1" max="40" required>
        <button type="submit">Reservar</button>
    </form>

    <h2>Reservas Existentes</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Laboratório</th>
                <th>Responsável</th>
                <th>Data</th>
                <th>Turno</th>
                <th>Finalidade</th>
                <th>Alunos</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tabela-reservas"></tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
